<!doctype html>
<!-- Мини-приложение «Отчёт» бота-тренера. v2.2 (24.11.2026): тренировка дня с отметкой подходов и таймером отдыха; картинки персонажа из закрытого хранилища; игра — персонаж, уровни, задания, ачивки, прогноз, календарь, карта мышц, фото до/после. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Качалка Азамата</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Тёмная «игровая» тема всегда — арт персонажа на тёмном фоне */
  :root {
    color-scheme: dark;
    --bg: #110f0d; --card: #1c1916; --card-2: #25211d; --line: rgba(255,255,255,.08);
    --text: #f4efe8; --muted: #a89f94; --dim: #6e665d;
    --fire: #ff7a1a; --gold: #ffc23d; --good: #3ddc84; --bad: #ff5a5a;
    --series-1: #3987e5; --series-3: #1fbf85; --series-2: #ff7a1a;
    --display: "Russo One", "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 "Inter", -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { padding: 10px 16px calc(28px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  .num { font-variant-numeric: tabular-nums; }
  h3 { font: 15px var(--display); letter-spacing: .3px; margin: 0 0 12px; text-transform: uppercase; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 12px; }
  .sub { color: var(--muted); font-size: 13px; }

  /* Герой */
  .hero { position: relative; border-radius: 24px; overflow: hidden; margin-bottom: 12px; background: radial-gradient(120% 80% at 50% 30%, #3a2412 0%, #17120e 55%, #110f0d 100%); border: 1px solid var(--line); }
  .hero-top { position: absolute; inset: 12px 12px auto 12px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 2; }
  .badge { font: 13px var(--display); background: rgba(0,0,0,.55); backdrop-filter: blur(6px); padding: 6px 10px; border-radius: 12px; border: 1px solid var(--line); }
  .badge b { color: var(--gold); }
  .flame { text-align: center; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 16px; padding: 6px 12px; }
  .flame .f { font-size: 26px; line-height: 1; display: inline-block; animation: flick 1.6s ease-in-out infinite; transform-origin: 50% 90%; }
  .flame .c { font: 22px var(--display); }
  .flame .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  @keyframes flick { 0%,100% { transform: scale(1) rotate(-3deg); } 50% { transform: scale(1.12) rotate(3deg); } }
  .char { display: block; width: 78%; max-width: 320px; margin: 18px auto 0; animation: breathe 3.2s ease-in-out infinite; transform-origin: 50% 100%; filter: drop-shadow(0 12px 24px rgba(0,0,0,.6)); }
  @keyframes breathe { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-4px) scale(1.012); } }
  .hero-bottom { position: relative; padding: 0 16px 16px; margin-top: -48px; z-index: 2; background: linear-gradient(transparent, rgba(17,15,13,.95) 40%); padding-top: 40px; }
  .stage-name { font: 24px var(--display); line-height: 1.1; }
  .xp { height: 12px; border-radius: 6px; background: rgba(255,255,255,.1); overflow: hidden; margin: 10px 0 6px; position: relative; }
  .xp > i { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: linear-gradient(90deg, var(--fire), var(--gold)); box-shadow: 0 0 12px rgba(255,122,26,.6); }
  .xp-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .stages { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 12px; }
  .stages button { border: 1px solid var(--line); background: var(--card-2); border-radius: 12px; padding: 0; overflow: hidden; aspect-ratio: 2/3; position: relative; cursor: pointer; }
  .stages img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; }
  .stages button.locked img { filter: grayscale(1) brightness(.25); }
  .stages button.locked::after { content: "🔒"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; }
  .stages button.cur { border: 2px solid var(--gold); box-shadow: 0 0 10px rgba(255,194,61,.5); }
  .stages button span { position: absolute; left: 3px; bottom: 2px; font: 10px var(--display); color: var(--text); text-shadow: 0 1px 2px #000; }

  /* Вкладки */
  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px; margin-bottom: 12px; position: sticky; top: 6px; z-index: 5; }
  .tabs button { border: 0; background: transparent; color: var(--muted); font: 600 13px "Inter", system-ui; padding: 9px 0; border-radius: 12px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--fire); color: #1a0d02; }
  section[hidden] { display: none; }

  /* Задания */
  .quest { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .quest:first-of-type { border-top: 0; }
  .quest .ic { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--card-2); font-size: 18px; flex: none; }
  .quest .t { flex: 1; font-weight: 600; }
  .quest .t small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .quest .st { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; flex: none; border: 2px solid var(--dim); color: transparent; }
  .quest.done .st { background: var(--good); border-color: var(--good); color: #062; }
  .quest.done .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--dim); }
  .quest.fail .st { background: var(--bad); border-color: var(--bad); color: #300; }
  .qhead { display: flex; justify-content: space-between; align-items: baseline; }
  .qhead b { font: 18px var(--display); color: var(--gold); }

  /* Кольца */
  .rings { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ring { text-align: center; }
  .ring svg { width: 100%; max-width: 140px; }
  .ring .v { font: 20px var(--display); }
  .bar { height: 10px; border-radius: 5px; background: var(--card-2); overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; border-radius: 5px; }
  .lbl { display: flex; justify-content: space-between; font-size: 14px; margin-top: 12px; }

  /* Ачивки */
  .achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .ach { background: var(--card-2); border: 1px solid var(--line); border-radius: 16px; padding: 10px 8px; text-align: center; }
  .ach .e { font-size: 28px; line-height: 1.2; }
  .ach .n { font-size: 12px; font-weight: 700; margin-top: 4px; line-height: 1.2; }
  .ach .p { height: 4px; border-radius: 2px; background: rgba(255,255,255,.08); margin-top: 6px; overflow: hidden; }
  .ach .p i { display: block; height: 100%; background: var(--fire); }
  .ach.locked .e { filter: grayscale(1); opacity: .35; }
  .ach.locked .n { color: var(--muted); }
  .ach.done { border-color: rgba(255,194,61,.5); background: linear-gradient(160deg, #3b2a10, var(--card-2)); }

  /* Календарь */
  .cal { display: grid; grid-auto-columns: 1fr; grid-auto-flow: column; grid-template-rows: repeat(7, auto); gap: 4px; }
  .cal i { aspect-ratio: 1; border-radius: 4px; background: var(--card-2); position: relative; }
  .cal i.logged { background: #4a3a26; } .cal i.good { background: #b8651c; } .cal i.perfect { background: var(--fire); box-shadow: 0 0 6px rgba(255,122,26,.5); }
  .cal i.today { outline: 2px solid var(--gold); outline-offset: 1px; }
  .cal i.trained::after { content: ""; position: absolute; inset: 35%; border-radius: 50%; background: #fff; opacity: .85; }
  .cal-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 10px; }
  .cal-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }

  /* Прогноз */
  .fc { display: flex; align-items: center; gap: 14px; }
  .fc .big { font: 28px var(--display); color: var(--gold); }

  /* Графики, списки */
  .chart { position: relative; height: 220px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  .legend i.dash { background: repeating-linear-gradient(90deg, var(--muted) 0 4px, transparent 4px 7px); }
  .legend i.dot { width: 8px; height: 8px; border-radius: 50%; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
  ul.list li:first-child { border-top: 0; }
  ul.list li span:last-child { color: var(--muted); white-space: nowrap; }
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .tile { background: var(--card-2); border-radius: 14px; padding: 10px 12px; }
  .tile .v { font: 22px var(--display); }
  .up { color: var(--bad); } .down { color: var(--good); } .flat { color: var(--muted); }
  select { width: 100%; font: inherit; color: var(--text); background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 0; }
  .err { text-align: center; padding: 60px 16px; color: var(--muted); }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  td, th { padding: 4px 2px; text-align: right; border-top: 1px solid var(--line); } td:first-child, th:first-child { text-align: left; }

  /* Карта мышц */
  .bodymap { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .bodymap svg { width: 100%; }
  .bodymap .cap { text-align: center; font-size: 12px; color: var(--muted); }
  .m0 { fill: #2c2723; } .m1 { fill: #6b3d17; } .m2 { fill: #c0621c; } .m3 { fill: #ff8a2a; }
  .bodymap .base { fill: #1f1b18; stroke: #3a332d; stroke-width: 1.5; }
  .mlist { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .mlist span { font-size: 12px; padding: 4px 8px; border-radius: 10px; background: var(--card-2); }
  .mlist span.zero { color: var(--bad); }

  /* Фото до/после */
  .ba { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 3/4; background: var(--card-2); user-select: none; touch-action: none; }
  .ba img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .ba .after { clip-path: inset(0 0 0 50%); }
  .ba .handle { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; background: var(--gold); transform: translateX(-50%); }
  .ba .handle::after { content: "⇆"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 34px; height: 34px; border-radius: 50%; background: var(--gold); color: #000; display: grid; place-items: center; font-weight: 700; }
  .ba .tag { position: absolute; top: 8px; font: 12px var(--display); background: rgba(0,0,0,.6); padding: 3px 8px; border-radius: 8px; }

  /* Просмотр формы */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: grid; place-items: center; z-index: 20; padding: 24px; }
  .modal[hidden] { display: none; }
  .modal img { max-width: 100%; max-height: 70vh; border-radius: 16px; }
  .modal .cap { text-align: center; margin-top: 10px; font: 18px var(--display); }

  /* Тренировка дня */
  .wo-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .wo-head .when { font: 13px var(--display); color: var(--gold); white-space: nowrap; }
  .wo-title { font: 20px var(--display); margin: 2px 0 4px; }
  .wo-ex { border-top: 1px solid var(--line); padding: 12px 0; }
  .wo-ex:first-of-type { border-top: 0; }
  .wo-row { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .wo-row .nm { flex: 1; font-weight: 600; }
  .wo-row .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .dots { display: flex; gap: 5px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--dim); }
  .dots i.on { background: var(--good); border-color: var(--good); }
  .wo-ex.done .nm { color: var(--muted); }
  .editor { display: none; margin-top: 10px; background: var(--card-2); border-radius: 14px; padding: 12px; }
  .wo-ex.open .editor { display: block; }
  .steppers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stepper { text-align: center; }
  .stepper .lb { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .stepper .ctl { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
  .stepper button { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--card); color: var(--text); font-size: 20px; cursor: pointer; }
  .stepper .v { font: 22px var(--display); }
  .go { width: 100%; margin-top: 10px; border: 0; border-radius: 14px; padding: 13px; font: 16px var(--display); background: var(--fire); color: #1a0d02; cursor: pointer; }
  .go:disabled { opacity: .45; }
  .undo { background: none; border: 0; color: var(--muted); font-size: 12px; margin-top: 8px; cursor: pointer; text-decoration: underline; }
  .rest { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 15; background: #000d; backdrop-filter: blur(8px);
    border: 1px solid var(--fire); border-radius: 18px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; max-width: 536px; margin: 0 auto; }
  .rest[hidden] { display: none; }
  .rest .t { font: 28px var(--display); color: var(--gold); min-width: 74px; }
  .rest .tx { flex: 1; font-size: 13px; color: var(--muted); }
  .rest button { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; padding: 8px 10px; font-size: 13px; }
</style>
</head>
<body>
<main id="app"><div class="err">Загружаю качалку…</div></main>
<div class="rest" id="rest" hidden><div class="t num" id="restT">1:30</div><div class="tx" id="restTx">Отдых. Дыши, пей воду.</div><button id="restSkip">Пропустить</button></div>
<div class="modal" id="modal" hidden><div><img id="modalImg" alt=""><div class="cap" id="modalCap"></div><div class="sub" style="text-align:center" id="modalSub"></div></div></div>
<script>
const API = "https://pfdiblftrpeqjabuppcw.supabase.co/functions/v1/app";
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand(); tg?.setHeaderColor?.("#110f0d"); tg?.setBackgroundColor?.("#110f0d");

const STAGES = ["Диванный босс", "Первые шаги", "Новичок качалки", "В форме", "Атлет", "Финальная форма"];
const STAGE_AT = [89.4, 87, 85, 83, 81, 80];
const $ = (s) => document.querySelector(s);
const fmtD = (iso) => `${iso.slice(8, 10)}.${iso.slice(5, 7)}`;
const ts = (iso) => Date.parse(iso + "T12:00:00");
const n0 = (x) => Math.round(+x || 0).toLocaleString("ru-RU");
const n1 = (x) => (Math.round((+x || 0) * 10) / 10).toLocaleString("ru-RU");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; };
const haptic = (t = "light") => tg?.HapticFeedback?.impactOccurred(t);
let HERO = [];
const heroSrc = (n) => HERO[n - 1] || `hero/stage${n}.webp`; // в проде — временные ссылки из закрытого хранилища

async function load() {
  const mock = new URLSearchParams(location.search).get("mock");
  if (mock) return (await fetch(mock)).json();
  if (!tg?.initData) throw new Error("Открой отчёт из бота — кнопка «📊 Отчёт».");
  const r = await fetch(API, { headers: { "x-tg-init-data": tg.initData } });
  if (r.status === 403) throw new Error("Это качалка Азамата. Тебе сюда нельзя 🙂");
  if (!r.ok) throw new Error("Сервер не ответил, попробуй ещё раз.");
  return r.json();
}

function ring(val, target, color, label, unit) {
  const p = target ? Math.min(1, val / target) : 0, over = target && val > target;
  const C = 2 * Math.PI * 42;
  return `<div class="ring" role="img" aria-label="${label}: ${n0(val)} из ${n0(target)} ${unit}">
    <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--card-2)" stroke-width="10"/>
    <circle cx="50" cy="50" r="42" fill="none" stroke="${over ? "var(--bad)" : color}" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p)}" transform="rotate(-90 50 50)"/></svg>
    <div class="v num" style="margin-top:-78px;margin-bottom:46px">${n0(val)}</div>
    <div class="sub">${label}<br>из ${n0(target)} ${unit}${over ? ` · <span class="up">+${n0(val - target)}</span>` : ""}</div></div>`;
}

function render(d) {
  HERO = d.hero || [];
  const t = d.targets || {}, g = d.goal, st = d.stage;
  const today = (d.days || []).find((r) => r.date === d.today) || { kcal: 0, protein: 0, fat: 0 };
  const qDone = d.quests.filter((q) => q.done).length;
  const nextName = STAGES[st.n] ;
  const b = d.body || {};
  const last2 = (k) => { const a = b[k] || []; return [a[a.length - 1]?.value, a.length > 1 ? a[a.length - 2].value : null]; };
  const [bf, bfp] = last2("body_fat"), [mk, mkp] = last2("muscle_kg"), [vf, vfp] = last2("visceral_fat"), [fk, fkp] = last2("fat_kg");
  const achDone = d.achievements.filter((a) => a.done).length;

  $("#app").innerHTML = `
  <div class="hero">
    <div class="hero-top">
      <div class="badge">УР. <b>${st.n}</b>/6</div>
      <div class="flame"><span class="f">🔥</span> <span class="c num">${d.streak}</span><div class="l">${plural(d.streak, "день", "дня", "дней")} подряд</div></div>
    </div>
    <img class="char" src="${heroSrc(st.n)}" alt="Персонаж: форма ${st.n} — ${esc(st.name)}">
    <div class="hero-bottom">
      <div class="sub">Тренд веса <b class="num" style="color:var(--text)">${n1(d.trend_now)} кг</b> · сброшено <b class="num" style="color:var(--good)">${n1(d.lost)} кг</b></div>
      <div class="stage-name">${esc(st.name)}</div>
      <div class="xp" role="img" aria-label="До следующей формы ${Math.round(st.progress * 100)}%"><i style="width:${Math.max(3, st.progress * 100)}%"></i></div>
      <div class="xp-row">${st.n < 6 ? `<span>до «${esc(nextName)}» ещё <b class="num" style="color:var(--text)">${n1(st.to_next)} кг</b></span><span>при ${n1(st.next_at)} кг</span>` : `<span>Цель взята. Ты машина 🏆</span>`}</div>
      <div class="stages">${STAGES.map((nm, i) => `<button class="${i + 1 > st.n ? "locked" : ""} ${i + 1 === st.n ? "cur" : ""}" data-stage="${i + 1}" aria-label="Форма ${i + 1}: ${nm}"><img src="${heroSrc(i + 1)}" alt="" loading="lazy"><span>${i + 1}</span></button>`).join("")}</div>
    </div>
  </div>

  <nav class="tabs" role="tablist">${[["main", "Главная"], ["weight", "Вес"], ["food", "Еда"], ["gym", "Зал"], ["photo", "Фото"]].map(([k, l], i) => `<button role="tab" data-tab="${k}" aria-selected="${i === 0}">${l}</button>`).join("")}</nav>

  <section data-panel="main">
    ${workoutCard(d)}
    <div class="card">
      <div class="qhead"><h3>Задания на сегодня</h3><b class="num">${qDone}/${d.quests.length}</b></div>
      ${d.quests.map((q) => `<div class="quest ${q.done ? "done" : q.fail ? "fail" : ""}"><div class="ic">${q.emoji}</div>
        <div class="t">${esc(q.title)}${q.target ? `<small class="num">${n0(q.value)} / ${n0(q.target)}</small>` : ""}</div>
        <div class="st">${q.done ? "✓" : q.fail ? "✕" : ""}</div></div>`).join("")}
    </div>
    <div class="card"><h3>Еда сегодня</h3>
      <div class="rings">${ring(today.kcal, today.kcal_target, "var(--fire)", "ккал", "")}${ring(today.protein, t.protein_g, "var(--series-3)", "белок", "г")}</div>

function calendar(d) {
  const cells = d.calendar.slice(-84);
  const pad = (new Date(cells[0].date).getDay() + 6) % 7; // понедельник сверху
  return Array(pad).fill("<i style='visibility:hidden'></i>").join("") +
    cells.map((c) => `<i class="${c.status} ${c.trained ? "trained" : ""} ${c.date === d.today ? "today" : ""}" title="${fmtD(c.date)}"></i>`).join("");
}
function tile(label, v, prev, unit, lowerIsGood = true, extra = "") {
  if (v == null) return `<div class="tile"><div class="sub">${label}</div><div class="v">—</div></div>`;
  let dl = `<span class="flat">первый замер</span>`;
  if (prev != null) { const dd = v - prev; dl = Math.abs(dd) < 0.05 ? `<span class="flat">без изменений</span>` : `<span class="${(lowerIsGood ? dd < 0 : dd > 0) ? "down" : "up"}">${dd > 0 ? "▲" : "▼"} ${n1(Math.abs(dd))} ${unit}</span>`; }
  return `<div class="tile"><div class="sub">${label}${extra}</div><div class="v num">${n1(v)}${unit ? ` <span class="sub">${unit}</span>` : ""}</div><div style="font-size:12px">${dl}</div></div>`;
}
function avgLine(days, k, tk, unit) {
  const logged = days.filter((r) => r.meals > 0).slice(-7);
  if (!logged.length) return `<div class="sub" style="margin-top:6px">Нет записей еды за неделю.</div>`;
  const avg = logged.reduce((s, r) => s + r[k], 0) / logged.length, tgt = logged.reduce((s, r) => s + (r[tk] || 0), 0) / logged.length;
  return `<div class="sub" style="margin-top:6px">В среднем за ${logged.length} дн.: <b class="num" style="color:var(--text)">${n0(avg)} ${unit}</b> при норме ${n0(tgt)}</div>`;
}

function photos(list) {
  if (!list.length) return `<div class="empty">Пришли боту фото в зеркало — в полный рост или торс. Он сохранит его как «до» (видно только тебе). Через 2 недели — ещё одно, в том же месте и свете, и тут появится сравнение.</div>`;
  const first = list[0], last = list[list.length - 1];
  if (list.length === 1) return `<div class="ba"><img src="${first.url}" alt="Фото ${fmtD(first.date)}"><span class="tag" style="left:8px">ДО · ${fmtD(first.date)}</span></div><div class="sub" style="margin-top:8px">Это точка «до». Следующее фото — через 2 недели.</div>`;
  return `<div class="ba" id="ba"><img src="${first.url}" alt="До ${fmtD(first.date)}"><img class="after" src="${last.url}" alt="После ${fmtD(last.date)}"><div class="handle"></div>
    <span class="tag" style="left:8px">ДО · ${fmtD(first.date)}</span><span class="tag" style="right:8px">${fmtD(last.date)}</span></div>
    <div class="sub" style="margin-top:8px">Тяни ползунок. Всего фото: ${list.length}.</div>`;
}
function initBA() {
  const ba = $("#ba"); if (!ba || ba.dataset.on) return; ba.dataset.on = 1;
  const move = (x) => { const r = ba.getBoundingClientRect(); const p = Math.max(0, Math.min(100, (x - r.left) / r.width * 100));
    ba.querySelector(".after").style.clipPath = `inset(0 0 0 ${p}%)`; ba.querySelector(".handle").style.left = p + "%"; };
  ba.addEventListener("pointerdown", (e) => { ba.setPointerCapture(e.pointerId); move(e.clientX); });
  ba.addEventListener("pointermove", (e) => { if (e.buttons) move(e.clientX); });
}

let charts = {};
function chart(id, cfg) {
  charts[id]?.destroy();
  Chart.defaults.color = "#a89f94"; Chart.defaults.font.family = "Inter, system-ui, sans-serif";
  cfg.options = Object.assign({ responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: "index", intersect: false } }, cfg.options || {});
  const pl = cfg.options.plugins || {};
  cfg.options.plugins = { ...pl, legend: { display: false }, tooltip: { padding: 10, cornerRadius: 10, boxPadding: 4, backgroundColor: "#000c", ...(pl.tooltip || {}) } };
  for (const ax of Object.values(cfg.options.scales || {})) { ax.grid = Object.assign({ color: "rgba(255,255,255,.07)", drawTicks: false }, ax.grid || {}); ax.border = { display: false }; ax.ticks = Object.assign({ padding: 6 }, ax.ticks || {}); }
  charts[id] = new Chart(document.getElementById(id), cfg);
}
function drawWeight(d) {
  const tr = d.trend || [], g = d.goal;
  const xs = tr.map((x) => ts(x.date));
  const minX = Math.min(...xs, ts(g.start_date)), maxX = Math.max(...xs, ts(d.today)) + 3 * 864e5;
  chart("cWeight", { type: "line", data: { datasets: [
      { label: "Взвешивание", data: tr.map((x) => ({ x: ts(x.date), y: +x.weight })), showLine: false, pointRadius: 4, pointHoverRadius: 6, pointBackgroundColor: "#a89f94", pointBorderColor: "#1c1916", pointBorderWidth: 2 },
      { label: "Тренд", data: tr.flatMap((x, i) => { const p = { x: ts(x.date), y: +x.trend }; return i && ts(x.date) - ts(tr[i - 1].date) > 14 * 864e5 ? [{ x: ts(x.date) - 1, y: null }, p] : [p]; }), spanGaps: false, borderColor: "#3987e5", borderWidth: 2, pointRadius: 0, tension: 0.25 },
      { label: "Цель", data: [{ x: minX, y: g.target }, { x: maxX, y: g.target }], borderColor: "#a89f94", borderWidth: 1.5, borderDash: [4, 3], pointRadius: 0 } ] },
    options: { scales: { x: { type: "linear", min: minX, max: maxX, ticks: { maxTicksLimit: 5, callback: (v) => fmtD(new Date(v).toISOString().slice(0, 10)) } },
      y: { suggestedMin: g.target - 1, suggestedMax: g.start + 1, ticks: { callback: (v) => v + " кг" } } },
      plugins: { tooltip: { callbacks: { title: (it) => fmtD(new Date(it[0].parsed.x).toISOString().slice(0, 10)), label: (c) => `${c.dataset.label}: ${n1(c.parsed.y)} кг` } } } } });
}
function drawFood(days) {
  const last = days.slice(-14), labels = last.map((r) => fmtD(r.date));
  const bar = { borderRadius: { topLeft: 4, topRight: 4 }, borderSkipped: "bottom", maxBarThickness: 18, categoryPercentage: 0.8, barPercentage: 0.9 };
  const line = (k) => ({ type: "line", label: "Норма", data: last.map((r) => r[k]), borderColor: "#a89f94", borderWidth: 1.5, borderDash: [4, 3], pointRadius: 0, stepped: "middle" });
  const opts = (u) => ({ scales: { x: { grid: { display: false }, ticks: { maxTicksLimit: 7 } }, y: { beginAtZero: true, ticks: { maxTicksLimit: 5 } } },

  chart("cKcal", { type: "bar", data: { labels, datasets: [{ label: "Съедено", data: last.map((r) => r.meals ? Math.round(r.kcal) : null), backgroundColor: last.map((r) => r.kcal_target && r.kcal > r.kcal_target ? "#ff5a5a" : "#ff7a1a"), ...bar }, line("kcal_target")] }, options: opts("ккал") });
  chart("cProt", { type: "bar", data: { labels, datasets: [{ label: "Белок", data: last.map((r) => r.meals ? Math.round(r.protein) : null), backgroundColor: "#1fbf85", ...bar }, line("protein_target")] }, options: opts("г") });
}
function drawEx(d, i) {
  const e = (d.exercises || [])[i]; if (!e) return;
  const pts = e.points, unit = e.bodyweight ? "повт." : "кг";
  chart("cEx", { type: "line", data: { labels: pts.map((p) => fmtD(p.date)), datasets: [{ label: e.bodyweight ? "Лучший подход" : "Расчётный максимум", data: pts.map((p) => p.value),

const DOW = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];
function whenLabel(date, today) {
  if (date === today) return "СЕГОДНЯ";
  const diff = Math.round((Date.parse(date) - Date.parse(today)) / 864e5);
  return diff === 1 ? "ЗАВТРА" : `${DOW[new Date(date + "T12:00:00Z").getUTCDay()].toUpperCase()} ${fmtD(date)}`;
}
function stepFor(w) { return w >= 20 ? 2.5 : w > 0 ? 1 : 0; }
function workoutCard(d) {
  const w = d.workout;
  SETS = d.sets_today || [];
  if (!w) return `<div class="card"><h3>Тренировка</h3><div class="empty">План на ближайшие дни ещё не собран — тренер соберёт его вечером.</div></div>`;
  const isToday = w.date === d.today;
  return `<div class="card" id="wo"><div class="wo-head"><h3>Тренировка</h3><span class="when">${whenLabel(w.date, d.today)}</span></div>
    <div class="wo-title">${esc(w.title)}</div><div class="sub">${esc(w.note || "")}</div>
    ${w.items.map((it) => exRow(it, isToday)).join("")}
    ${isToday ? "" : `<div class="sub" style="margin-top:8px">Отмечать подходы можно в день тренировки.</div>`}</div>`;
}
function exRow(it, isToday) {
  const done = SETS.filter((s) => s.exercise_id === it.exercise_id);
  const n = Math.max(it.n_sets, done.length);
  const all = done.length >= it.n_sets;
  const wtxt = it.weight > 0 ? `${n1(it.weight)} кг` : "свой вес";
  const lastDone = done[done.length - 1];
  const e = EDIT[it.exercise_id] ?? { w: lastDone ? +lastDone.weight_kg : it.weight, r: lastDone ? lastDone.reps : it.rep_max };
  EDIT[it.exercise_id] = e;
  return `<div class="wo-ex ${all ? "done" : ""}" data-ex="${it.exercise_id}">
    <div class="wo-row"><div class="nm">${esc(it.exercise)}<small>${it.sets} · ${wtxt}${it.last ? ` · было ${esc(it.last)}` : ""}</small></div>
      <div class="dots" aria-label="Сделано ${done.length} из ${it.n_sets}">${Array.from({ length: n }, (_, i) => `<i class="${i < done.length ? "on" : ""}"></i>`).join("")}</div></div>
    ${isToday ? `<div class="editor">
      <div class="steppers">
        <div class="stepper"><div class="lb">Вес, кг</div><div class="ctl"><button data-d="w-">−</button><span class="v num" data-v="w">${it.weight > 0 || e.w > 0 ? n1(e.w) : "—"}</span><button data-d="w+">+</button></div></div>
        <div class="stepper"><div class="lb">Повторы</div><div class="ctl"><button data-d="r-">−</button><span class="v num" data-v="r">${e.r}</span><button data-d="r+">+</button></div></div>
      </div>
      <button class="go" data-go>✓ Подход ${done.length + 1}</button>
      ${done.length ? `<button class="undo" data-undo>отменить последний подход</button>` : ""}
    </div>` : ""}</div>`;
}
function bindWorkout(d) {
  const box = document.getElementById("wo"); if (!box || !d.workout) return;
  const items = Object.fromEntries(d.workout.items.map((it) => [it.exercise_id, it]));
  box.onclick = async (ev) => {
    const ex = ev.target.closest(".wo-ex"); if (!ex) return;
    const id = +ex.dataset.ex, it = items[id], e = EDIT[id];
    if (ev.target.closest(".wo-row")) { const was = ex.classList.contains("open"); box.querySelectorAll(".wo-ex.open").forEach((x) => x.classList.remove("open")); if (!was) ex.classList.add("open"); haptic(); return; }
    const dd = ev.target.closest("[data-d]")?.dataset.d;
    if (dd) {
      const st = stepFor(Math.max(e.w, it.weight));
      if (dd === "w+") e.w = Math.round((e.w + (st || 1)) * 10) / 10; if (dd === "w-") e.w = Math.max(0, Math.round((e.w - (st || 1)) * 10) / 10);
      if (dd === "r+") e.r++; if (dd === "r-") e.r = Math.max(1, e.r - 1);
      ex.querySelector('[data-v="w"]').textContent = e.w > 0 ? n1(e.w) : "—"; ex.querySelector('[data-v="r"]').textContent = e.r;
      tg?.HapticFeedback?.selectionChanged(); return;
    }
    const go = ev.target.closest("[data-go]"), undo = ev.target.closest("[data-undo]");
    if (!go && !undo) return;
    (go || undo).disabled = true;
    try {
      const res = await post(go ? { action: "log_set", exercise_id: id, weight_kg: e.w, reps: e.r } : { action: "undo_set", exercise_id: id });
      if (!res.ok) throw new Error(res.error || "ошибка");
      SETS = res.sets_today;
      ex.outerHTML = exRow(it, true);
      const fresh = box.querySelector(`[data-ex="${id}"]`);
      const nDone = SETS.filter((s) => s.exercise_id === id).length;
      if (go) {
        tg?.HapticFeedback?.notificationOccurred("success");
        if (nDone < it.n_sets) { fresh.classList.add("open"); startRest(it.rep_max <= 8 ? 120 : 90, `Дальше: подход ${nDone + 1} — ${esc(it.exercise)}`); }
        else { const next = fresh.nextElementSibling; if (next?.classList.contains("wo-ex")) next.classList.add("open"); startRest(120, next?.classList.contains("wo-ex") ? `Дальше: ${esc(items[+next.dataset.ex].exercise)}` : "Последнее упражнение сделано — красава 💪"); }
      } else fresh.classList.add("open");
    } catch (err) { tg?.showAlert?.("Не записалось: " + err.message) ?? alert("Не записалось: " + err.message); (go || undo).disabled = false; }
  };
}
async function post(body) {
  if (new URLSearchParams(location.search).get("mock")) { // локальная проверка без сервера
    if (body.action === "log_set") SETS.push({ exercise_id: body.exercise_id, set_no: SETS.length + 1, weight_kg: body.weight_kg, reps: body.reps });
    if (body.action === "undo_set") { const i = SETS.map((s) => s.exercise_id).lastIndexOf(body.exercise_id); if (i >= 0) SETS.splice(i, 1); }
    return { ok: true, sets_today: [...SETS] };
  }
  const r = await fetch(API, { method: "POST", headers: { "x-tg-init-data": tg.initData, "content-type": "application/json" }, body: JSON.stringify(body) });
  return r.json();
}
let restTimer = null;
function startRest(sec, text) {
  clearInterval(restTimer);
  const box = $("#rest"), t = $("#restT");
  $("#restTx").innerHTML = text; box.hidden = false;
  const end = Date.now() + sec * 1000;
  const tick = () => {
    const left = Math.max(0, Math.round((end - Date.now()) / 1000));
    t.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
    if (left === 0) { clearInterval(restTimer); tg?.HapticFeedback?.notificationOccurred("warning"); t.textContent = "Погнали"; setTimeout(() => box.hidden = true, 4000); }
  };
  tick(); restTimer = setInterval(tick, 500);
  $("#restSkip").onclick = () => { clearInterval(restTimer); box.hidden = true; };
}

load().then(render).catch((e) => { $("#app").innerHTML = `<div class="err">${esc(e.message)}</div>`; });
</script>
</body>
